name: Release smoke test

# Mirrors the release-only steps of release.yml without publishing to npm and
# without keeping a tag: dispatch this before changing release.yml, or when a
# release has to be retried by hand.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if version has been updated
        id: check
        run: |
          before=$(git show HEAD~1:package.json 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' || true)
          after=$(node -p 'require("./package.json").version')
          echo "package.json version: ${before:-<none>} -> ${after}"
          if [ -n "${before}" ] && [ "${before}" = "${after}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js from nvmrc
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get version
        id: package-version
        run: echo "current-version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish dry run
        run: |
          # `--dry-run` still refuses a version that is already on the registry,
          # so pack a throwaway prerelease instead of the released one.
          npm version "0.0.0-smoke.$(date +%s)" --no-git-tag-version --allow-same-version
          npm publish --access public --dry-run --tag smoke

      - name: Tag commit and push (same step as release.yml)
        id: tag_version
        run: |
          tag="v${{ steps.package-version.outputs.current-version }}"
          echo "new_tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "${tag} already exists; skipping the tag push."
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi

      - name: Exercise the missing-tag branch
        run: |
          # The step above takes its skip branch for an already-released version;
          # run the create-and-push branch against a throwaway tag.
          tag="smoke-${GITHUB_RUN_ID}"
          git tag "${tag}"
          git push origin "${tag}"
          git push origin --delete "${tag}"

      - name: Assert tag output
        run: |
          echo "changed:         ${{ steps.check.outputs.changed }}"
          echo "current-version: ${{ steps.package-version.outputs.current-version }}"
          echo "new_tag:         ${{ steps.tag_version.outputs.new_tag }}"
          test "${{ steps.tag_version.outputs.new_tag }}" = "v${{ steps.package-version.outputs.current-version }}"

      - name: Prepare archive
        run: zip -r dist dist

      - name: Assert archive
        run: unzip -l dist.zip | tail -3
