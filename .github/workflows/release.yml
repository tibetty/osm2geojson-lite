name: Release

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-check:
    name: Check if version changed
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The check below compares package.json with the previous commit.
          fetch-depth: 2

      - name: Check if version has been updated
        id: check
        run: |
          before=$(git show HEAD~1:package.json 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' || true)
          after=$(node -p 'require("./package.json").version')
          echo "package.json version: ${before:-<none>} -> ${after}"
          if [ -n "${before}" ] && [ "${before}" = "${after}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      publish: ${{ steps.check.outputs.changed }}

  release:
    name: Build and test
    needs: release-check
    if: ${{ needs.release-check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build

      # Publishing cannot be undone, and CI is not a dependency of this
      # workflow: both start on the same push and run in parallel, so a red
      # `main` would otherwise publish anyway. Gate the upload on the suite CI
      # runs.
      - name: Run tests
        run: npm test

      # The upload lives in its own job so the approval gate sits *after* the
      # tests: a reviewer is only asked once the suite is green.
      - name: Upload the tested build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the human gate before the
    # upload. The environment name must also be configured on the npm trusted
    # publisher: a mismatch fails the OIDC exchange with a misleading 404.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/osm2geojson-lite
    permissions:
      id-token: write  # Required for trusted publishing
      contents: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from nvmrc
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: .nvmrc
          cache: npm

      # The bytes that passed the suite, not a second build.
      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Get version
        id: package-version
        run: echo "current-version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish NPM package
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "osm2geojson-lite@${version}" version >/dev/null 2>&1; then
            echo "osm2geojson-lite@${version} is already published; skipping the upload."
          else
            npm publish --access public
          fi

      - name: Tag commit and push
        id: tag_version
        run: |
          tag="v${{ steps.package-version.outputs.current-version }}"
          echo "new_tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "${tag} already exists; skipping the tag push."
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi

      - name: Create Archive
        run: |
          zip -r dist dist

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          artifacts: "dist.zip"
          artifactContentType: "application/zip"
          allowUpdates: true
          draft: false
