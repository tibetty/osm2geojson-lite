name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:          
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported major (package.json engines) and the one in .nvmrc.
        node-version: ['22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build project
        run: |
          npm run build

      - name: Run tests
        run: |
          npm run test
      - name: Upload coverage
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
